<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="X-Frame-Options" content="ALLOWALL">
<title>Agent Production — Valoram Solutions</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --orange:#F0891A;--orange-light:#f5a44e;--orange-dim:rgba(240,137,26,0.08);
    --blue:#1B3A6B;--blue-dim:rgba(27,58,107,0.08);--blue-light:#2a52a0;
    --bg:#f0f2f5;--surface:#fff;--surface2:#fafafa;--surface3:#f4f6f8;
    --border:#e4e7ec;--border2:#eef0f3;
    --text:#111827;--text2:#374151;--text3:#6b7280;--text4:#9ca3af;
    --navy:#101820;
    --radius:12px;--radius-sm:8px;
    --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 4px 16px rgba(0,0,0,0.08);
  }
  body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;font-size:16px;min-height:100vh}
  .page-header{background:#fff;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:72px;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--orange);box-shadow:0 2px 8px rgba(0,0,0,0.06);gap:16px}
  .logo-img{height:42px;width:auto;display:block}
  .header-right{display:flex;align-items:center;gap:16px}
  .header-stats{display:flex;gap:24px}
  .hstat{text-align:right}
  .hstat-val{font-size:22px;font-weight:700;color:var(--orange);font-family:'DM Mono',monospace;line-height:1}
  .hstat-lbl{font-size:11px;color:var(--text4);letter-spacing:0.08em;text-transform:uppercase;margin-top:3px}
  .last-updated{font-size:10px;color:var(--text4);white-space:nowrap}
  .refresh-btn{display:flex;align-items:center;gap:7px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:background 0.15s,box-shadow 0.15s;white-space:nowrap;flex-shrink:0}
  .refresh-btn:hover{background:var(--orange-light);box-shadow:0 2px 8px rgba(240,137,26,0.3)}
  .refresh-btn:disabled{opacity:0.5;cursor:not-allowed}
  .refresh-btn svg{width:14px;height:14px;flex-shrink:0}
  .refresh-btn.spinning svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--navy);color:#fff;padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;border-left:4px solid var(--orange);box-shadow:var(--shadow-md);opacity:0;transform:translateY(8px);transition:all 0.3s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}

  /* FILTER BAR */
  .filter-bar{background:#fff;border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:72px;z-index:99;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
  .filter-group{display:flex;align-items:center;gap:8px}
  .filter-group label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap}
  .filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;font-family:'Poppins',sans-serif;font-size:12px;color:var(--text);outline:none;cursor:pointer;transition:border-color 0.15s;min-width:120px}
  .filter-select:focus{border-color:var(--orange)}
  .filter-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;font-family:'Poppins',sans-serif;font-size:12px;color:var(--text);outline:none;transition:border-color 0.15s;width:130px}
  .filter-input:focus{border-color:var(--orange)}
  .filter-sep-v{width:1px;height:24px;background:var(--border);margin:0 4px}
  .clear-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;transition:all 0.15s;white-space:nowrap}
  .clear-btn:hover{border-color:var(--orange);color:var(--orange)}
  .filter-count{font-size:11px;color:var(--text3);margin-left:auto;white-space:nowrap}
  .filter-count strong{color:var(--orange);font-weight:700}

  .main{padding:24px 32px;max-width:1600px;margin:0 auto}
  .loading{padding:60px;text-align:center;color:var(--text3);font-size:14px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
  .loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
  .no-results{padding:48px;text-align:center;color:var(--text3);font-size:14px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
  .page-footer{text-align:center;padding:24px;font-size:11px;color:var(--text4);border-top:1px solid var(--border);margin-top:8px}
  mark{background:rgba(240,137,26,0.15);color:var(--orange);border-radius:2px;padding:0 2px}

  /* COLOR CLASSES */
  .v-orange{color:var(--orange)}
  .v-blue{color:var(--blue)}
  .v-dim{color:var(--text4);font-weight:400}


  .search-container{position:relative}
  .search-container input{width:250px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 14px 9px 38px;font-family:'Poppins',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color 0.15s,box-shadow 0.15s}
  .search-container input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(240,137,26,0.12)}
  .search-container input::placeholder{color:var(--text4)}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text4);font-size:15px;pointer-events:none}
  .manager-block{background:var(--surface);border:1px solid var(--border);border-bottom:3px solid var(--orange);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow 0.15s,transform 0.15s}
  .manager-block:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .manager-block.highlighted{border-color:var(--orange);box-shadow:0 0 0 2px rgba(240,137,26,0.2),var(--shadow-md)}
  .manager-row{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:#fff;flex-wrap:wrap;gap:16px}
  .mgr-left{display:flex;align-items:center;gap:12px}
  .rank{width:28px;height:28px;border-radius:50%;background:var(--orange-dim);border:1px solid rgba(240,137,26,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--orange);flex-shrink:0}
  .rank.gold{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 2px 6px rgba(240,137,26,0.4)}
  .rank.silver{background:rgba(240,137,26,0.22);color:var(--orange)}
  .rank.bronze{background:rgba(240,137,26,0.12);color:var(--orange)}
  .mgr-avatar{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(240,137,26,0.35)}
  .mgr-name{font-size:17px;font-weight:700;color:var(--navy)}
  .mgr-meta{font-size:13px;color:var(--text3);margin-top:3px}
  .totals-row{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;row-gap:8px}
  .summary-tiles{display:flex;gap:8px;align-items:stretch;padding-left:16px;margin-left:auto}
  .tot-col{text-align:right;padding:0 20px;border-left:1px solid var(--border2)}
  .tot-col:first-child{border-left:none}
  .tot-lbl{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text4);margin-bottom:5px;font-weight:600}
  .tot-val{font-size:19px;font-weight:700;font-family:'DM Mono',monospace;line-height:1}
  .tot-sub{font-size:12px;font-family:'DM Mono',monospace;margin-top:4px;color:var(--text3);white-space:nowrap}
  .tot-sub span{color:var(--text2);font-weight:600}
  .total-ip{display:flex;flex-direction:column;justify-content:center;text-align:right;padding:10px 22px 10px 18px;border-left:none;border-radius:8px;background:linear-gradient(135deg,rgba(27,58,107,0.08) 0%,rgba(27,58,107,0.03) 100%);box-shadow:inset 0 0 0 1px rgba(27,58,107,0.18);position:relative;overflow:hidden;min-width:130px}
  .total-ip::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--navy);border-radius:8px 8px 0 0}
  .total-ip-lbl{font-size:8.5px;letter-spacing:0.13em;text-transform:uppercase;color:var(--navy);margin-bottom:6px;font-weight:700;opacity:0.75}
  .total-ip-val{font-size:22px;font-weight:800;font-family:'DM Mono',monospace;line-height:1;color:var(--navy)}
  .total-ip-sub{display:none}
  .total-sub{display:flex;flex-direction:column;justify-content:center;text-align:right;padding:10px 22px 10px 18px;border-left:none;border-radius:8px;background:linear-gradient(135deg,rgba(240,137,26,0.08) 0%,rgba(240,137,26,0.03) 100%);box-shadow:inset 0 0 0 1px rgba(240,137,26,0.18);position:relative;overflow:hidden;min-width:130px}
  .total-sub::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--orange);border-radius:8px 8px 0 0}
  .total-sub-lbl{font-size:8.5px;letter-spacing:0.13em;text-transform:uppercase;color:var(--orange);margin-bottom:6px;font-weight:700;opacity:0.85}
  .total-sub-val{font-size:22px;font-weight:800;font-family:'DM Mono',monospace;line-height:1;color:var(--orange)}
  .total-sub-sub{display:none}
  .v-orange{color:var(--orange)}
  .v-blue{color:var(--blue)}
  .v-dim{color:var(--text4);font-weight:400}
  @media(max-width:700px){
    .page-header{padding:0 16px;height:auto;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
    .header-stats{display:none}
    .search-container input{width:180px}
    .main{padding:16px}
    .tot-col{padding:0 10px}
    .filter-bar{padding:10px 16px;top:60px}
  }


  .page-nav{background:var(--navy);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 32px;display:flex;position:sticky;top:72px;z-index:99}
  .page-nav a{display:block;padding:12px 18px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);text-decoration:none;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap}
  .page-nav a:hover{color:rgba(255,255,255,0.75)}
  .page-nav a.act{color:var(--orange);border-bottom-color:var(--orange)}
  .mgr-badge{display:inline-block;font-size:9px;background:rgba(240,137,26,0.1);color:var(--orange);border:1px solid rgba(240,137,26,0.25);border-radius:3px;padding:1px 6px;letter-spacing:0.07em;text-transform:uppercase;margin-left:6px;vertical-align:middle}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;align-items:center;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:var(--radius);padding:28px;width:420px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,0.18)}
  .modal-title{font-size:18px;font-weight:700;color:var(--navy)}
  .form-field{display:flex;flex-direction:column;gap:5px}
  .form-field label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);font-weight:600}
  .form-field input{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-family:'Poppins',sans-serif;font-size:13px;color:var(--text);outline:none}
  .form-field input:focus{border-color:var(--orange)}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
  .mbtn{padding:8px 18px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text3);transition:all 0.15s}
  .mbtn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .mbtn.primary:hover{background:var(--orange-light)}
  .refresh-btn-cfg{display:flex;align-items:center;gap:7px;background:transparent;color:var(--text3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 14px;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap}
  .refresh-btn-cfg:hover{border-color:var(--orange);color:var(--orange)}

  html,body{height:auto!important;overflow-x:hidden;}
  .page-header{position:relative!important;top:auto!important;}
  .filter-bar{position:relative!important;top:auto!important;z-index:10;}
  .main{padding:16px 20px;}
  @media(max-width:900px){
    .totals-row{flex-wrap:wrap;gap:8px;}
    .tot-col{min-width:140px;}
    .total-ip{min-width:140px;}
    .manager-row{flex-wrap:wrap;gap:12px;}
    .page-header{padding:12px 16px;flex-wrap:wrap;gap:10px;}
    .header-right{flex-wrap:wrap;gap:8px;}
    .search-container input{width:180px;}
    .header-stats{display:none;}
  }

/* ══════════════════════════════════════════════════════════════════════════
   VISUAL ENHANCEMENT LAYER  ·  Valoram Solutions
   Appended last so it refines the existing design without altering layout,
   markup, ids or behaviour. Same structure — richer finish.
   ══════════════════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion:no-preference){
  @keyframes vx-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes vx-shimmer{to{background-position:200% 0}}
  @keyframes vx-sheen{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
}
:root{
  --vx-ease:cubic-bezier(.22,.61,.36,1);
  --shadow:0 1px 2px rgba(16,24,32,.05),0 2px 6px rgba(16,24,32,.05);
  --shadow-md:0 10px 30px rgba(16,24,32,.10),0 3px 8px rgba(16,24,32,.06);
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;scroll-behavior:smooth}

/* Ambient, depth-giving backdrop (kept very subtle) */
body{
  background:
    radial-gradient(1100px 560px at 100% -8%, rgba(240,137,26,.06), transparent 60%),
    radial-gradient(900px 520px at -8% 4%, rgba(27,58,107,.05), transparent 58%),
    var(--bg);
  background-attachment:fixed;
}

/* Tabular figures for every numeric readout — columns line up perfectly */
.kpi-val,.kpi-sub,.lb-ip,.drawer-val,.tot-val,.tot-sub,.total-ip-val,.total-sub-val,
.gt-val,.hstat-val,.sum-val,.qs-val,.fval,.fpct,.tp-val,.team-tot-val,.mgr-cell,
.agent-sub-cell,.drawer-cases,td.num,td.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.page-header{position:relative;border-bottom-color:transparent;box-shadow:0 1px 0 rgba(16,24,32,.05),0 6px 20px rgba(16,24,32,.05)}
.page-header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
  background:linear-gradient(90deg,var(--orange),var(--orange-light),var(--orange));
  background-size:200% 100%;animation:vx-shimmer 7s linear infinite}
.logo-img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.10))}

/* ── NAV ────────────────────────────────────────────────────────────────── */
.page-nav{background:linear-gradient(180deg,#17222d 0%,var(--navy) 100%);box-shadow:inset 0 -1px 0 rgba(255,255,255,.05)}
.page-nav a{position:relative;transition:color .2s var(--vx-ease),background .2s var(--vx-ease)}
.page-nav a:hover{background:rgba(255,255,255,.045)}
.page-nav a.act::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;
  background:var(--orange);box-shadow:0 0 12px var(--orange),0 0 4px var(--orange)}

/* ── CARDS: entrance + lift ─────────────────────────────────────────────── */
.kpi-card,.section-card,.manager-block,.table-wrap{transition:transform .28s var(--vx-ease),box-shadow .28s var(--vx-ease)}
.kpi-card{animation:vx-rise .5s var(--vx-ease) both}
.section-card,.manager-block{animation:vx-rise .6s var(--vx-ease) both}
.kpi-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.section-card:hover,.manager-block:hover{box-shadow:var(--shadow-md)}
.kpi-grid .kpi-card:nth-child(2){animation-delay:.05s}
.kpi-grid .kpi-card:nth-child(3){animation-delay:.10s}
.kpi-grid .kpi-card:nth-child(4){animation-delay:.15s}
.kpi-grid .kpi-card:nth-child(5){animation-delay:.20s}
.kpi-grid .kpi-card:nth-child(6){animation-delay:.25s}
.kpi-card::before{height:4px;filter:saturate(1.12)}
.kpi-val{letter-spacing:-.018em}
.section-title{letter-spacing:-.01em}

/* ── LEADERBOARD ────────────────────────────────────────────────────────── */
.lb-row{transition:background .16s var(--vx-ease),box-shadow .16s var(--vx-ease)}
.lb-avatar{background:linear-gradient(135deg,var(--orange),var(--orange-light));box-shadow:0 3px 9px rgba(240,137,26,.34)}
.lb-rank.r1{box-shadow:0 3px 12px rgba(245,158,11,.55)}
.lb-rank.r2{box-shadow:0 3px 10px rgba(100,116,139,.4)}
.lb-rank.r3{box-shadow:0 3px 10px rgba(160,90,44,.4)}

/* ── PILLS / PERIOD ─────────────────────────────────────────────────────── */
.pill{transition:transform .18s var(--vx-ease),background .18s var(--vx-ease),color .18s var(--vx-ease),box-shadow .18s var(--vx-ease)}
.pill:hover{transform:translateY(-1px)}
.pill.active{box-shadow:0 5px 14px rgba(240,137,26,.34);transform:translateY(-1px)}

/* ── BUTTONS ────────────────────────────────────────────────────────────── */
.refresh-btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--orange),var(--orange-light));box-shadow:0 4px 12px rgba(240,137,26,.30)}
.refresh-btn::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:0;transform:translateX(-120%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);pointer-events:none}
.refresh-btn:hover::after{animation:vx-sheen .9s var(--vx-ease)}
.refresh-btn:active{transform:translateY(1px)}
.mbtn.primary{background:linear-gradient(135deg,var(--orange),var(--orange-light));box-shadow:0 3px 10px rgba(240,137,26,.28)}
.mbtn{transition:all .15s var(--vx-ease)}
.clear-btn:hover,.btn-cfg:hover{transform:translateY(-1px)}

/* ── INPUTS: focus rings ────────────────────────────────────────────────── */
.filter-select:focus,.filter-input:focus,.filter-sel:focus,.search-input:focus,
.date-in:focus,.form-field input:focus,.search-container input:focus{
  border-color:var(--orange)!important;box-shadow:0 0 0 3px var(--orange-dim)}

/* ── TABLES ─────────────────────────────────────────────────────────────── */
.mgr-main-row,.agent-sub-row,tbody tr{transition:background .14s var(--vx-ease)}
.status-pill{box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}

/* ── TOTALS TILES (agent / manager) ─────────────────────────────────────── */
.total-ip,.total-sub{transition:transform .2s var(--vx-ease),box-shadow .2s var(--vx-ease)}
.manager-block:hover .total-ip,.manager-block:hover .total-sub{transform:translateY(-1px)}
.mgr-avatar{background:linear-gradient(135deg,var(--orange),var(--orange-light))}

/* ── MISC POLISH ────────────────────────────────────────────────────────── */
.top-producer-box{transition:transform .2s var(--vx-ease),box-shadow .2s var(--vx-ease)}
.top-producer-box:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.toast{box-shadow:0 12px 34px rgba(16,24,32,.28)}
.section-chevron{transition:transform .25s var(--vx-ease)}

/* ── CUSTOM SCROLLBARS ──────────────────────────────────────────────────── */
*{scrollbar-width:thin;scrollbar-color:rgba(16,24,32,.22) transparent}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(16,24,32,.20);border-radius:9px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(16,24,32,.34);background-clip:content-box}

/* Honour reduced-motion */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;scroll-behavior:auto!important}
  .kpi-card,.section-card,.manager-block{opacity:1!important;transform:none!important}
}

</style></head>
<body>

<script>const ISSUED_SET=new Set(["PolicyIssued","PolicyPaid","PolicyInforce","PolicyInforcePaid","PolicyInforceFirstYear","PolicyInforceRenewals","PolicyInforceAwaitingCommissions","PolicyInforceWithRequirements","PolicyInforceNoncommissionable","PolicySurrendered","PolicyReissued","PolicyConversion","PolicyConfirmInforce","PolicyIssuedDeliveryRequirements","PolicyIssuedeDeliveryRequirements","PolicyService"]);
const INACTIVE_STATUSES=new Set(["Inactive","Terminated","Retired","Deceased","Released","NotAFit","DoNotContact","Vectored","DoesNotQualify","Denied"]);

function openCfg(){document.getElementById('modalOverlay').classList.add('open');}
function closeCfg(){document.getElementById('modalOverlay').classList.remove('open');}
function showToast(msg,isErr){const t=document.getElementById('toast');t.textContent=msg;t.style.borderLeftColor=isErr?'#ef4444':'var(--orange)';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),5000);}
function saveCfg(){const ep=document.getElementById('cfgEp').value.trim(),key=document.getElementById('cfgKey').value.trim();if(!ep||!key){showToast('Endpoint and key required',true);return;}cfg={ep,key};localStorage.setItem(CK,JSON.stringify(cfg));closeCfg();loadData();}

async function gqlFetch(query,variables){
  const r=await fetch(cfg.ep,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(variables?{query,variables}:{query})});
  const txt=await r.text();let d;try{d=JSON.parse(txt);}catch(e){throw new Error('Non-JSON: '+txt.slice(0,300));}
  if(d.errors)throw new Error(d.errors.map(e=>e.message).join('; '));return d;
}

async function fetchAdvisors(){
  const Q=`query($after:String){advisors(first:250,after:$after){pageInfo{hasNextPage endCursor}nodes{id name advisorStatus internalManagers{id startDate endDate manager{... on User{id name}... on Team{id name}}}}}}`;
  let all=[],cursor=null;
  while(true){
    const d=await gqlFetch(Q,cursor?{after:cursor}:{});
    const pi=d?.data?.advisors;
    if(!pi) break;
    all=all.concat(pi.nodes);
    if(!pi.pageInfo.hasNextPage) break;
    cursor=pi.pageInfo.endCursor;
  }
  return all.filter(a=>
    a.advisorStatus==='Active'&&
    (a.name||'').trim()!==''&&
    (a.name||'').toLowerCase()!=='unknown agent'
  );
}

const APQ=`query($id:ID!){advisor(id:$id){policies{id policyStatus signedDate issuedDate paidDate annualizedPremium productType{name}writingAdvisors{advisor{id}commissionPercent}}}}`;

async function fetchAdvisorPolicies(id){
  try{const d=await gqlFetch(APQ,{id});return d?.data?.advisor?.policies||[];}
  catch(e){console.warn('Failed:',id,e.message);return[];}
}

async function fetchAllAdvisorData(advisors,onProgress){
  const BATCH=10,results={};
  for(let i=0;i<advisors.length;i+=BATCH){
    const batch=advisors.slice(i,i+BATCH);
    await Promise.all(batch.map(async a=>{const policies=await fetchAdvisorPolicies(a.id);results[a.id]={...a,policies};}));
    if(onProgress)onProgress(Math.min(i+BATCH,advisors.length),advisors.length);
  }
  return results;
}

function classifyPolicy(p,advisorId){
  const base=parseFloat(p.annualizedPremium)||0;
  if(base===0) return null;
  const wa=(p.writingAdvisors||[]).find(w=>w.advisor?.id===advisorId);
  const pct=wa!=null?parseFloat(wa.commissionPercent)||0:100;
  if(pct===0) return null;
  const pr=base*(pct/100);
  const ty=(p.productType?.name||'').toLowerCase();
  const isL=ty.includes('life')||ty.includes('term')||ty.includes('whole')||ty.includes('ul')||ty.includes('iul')||ty.includes('disab')||ty.includes('linked');
  const isA=ty.includes('annuity')||ty.includes('ann');
  const isIP=ISSUED_SET.has(p.policyStatus);
  const submitDate=p.signedDate||'';
  const issueDate=p.paidDate||p.issuedDate||'';
  return{pr,isL,isA,isIP,submitDate,issueDate,
    ls:isL?pr:0,lp:isL&&isIP?pr:0,as_:isA?pr:0,ap:isA&&isIP?pr:0,
    ls_c:isL?1:0,lp_c:isL&&isIP?1:0,as_c:isA?1:0,ap_c:isA&&isIP?1:0};
}

function calcStats(recs){return{
  tLS:recs.reduce((s,r)=>s+r.ls,0),tLP:recs.reduce((s,r)=>s+r.lp,0),
  tAS:recs.reduce((s,r)=>s+r.as_,0),tAP:recs.reduce((s,r)=>s+r.ap,0),
  cLS:recs.reduce((s,r)=>s+r.ls_c,0),cLP:recs.reduce((s,r)=>s+r.lp_c,0),
  cAS:recs.reduce((s,r)=>s+r.as_c,0),cAP:recs.reduce((s,r)=>s+r.ap_c,0)};
}

function inDateRange(date,fFrom,fTo){if(!date)return true;if(fFrom&&date<fFrom)return false;if(fTo&&date>fTo)return false;return true;}

function applyDateProductFilter(recs,fFrom,fTo,fProduct){
  if(!fFrom&&!fTo&&!fProduct) return recs;
  return recs.map(r=>{
    const subInRange=inDateRange(r.submitDate,fFrom,fTo);
    const ipInRange=inDateRange(r.issueDate,fFrom,fTo);
    const prodOk=!fProduct||(fProduct==='life'&&r.isL)||(fProduct==='ann'&&r.isA);
    if(!prodOk) return null;
    return{...r,
      ls:r.isL&&subInRange?r.ls:0,ls_c:r.isL&&subInRange?r.ls_c:0,
      as_:r.isA&&subInRange?r.as_:0,as_c:r.isA&&subInRange?r.as_c:0,
      lp:r.isL&&ipInRange?r.lp:0,lp_c:r.isL&&ipInRange?r.lp_c:0,
      ap:r.isA&&ipInRange?r.ap:0,ap_c:r.isA&&ipInRange?r.ap_c:0};
  }).filter(r=>r&&(r.ls_c||r.lp_c||r.as_c||r.ap_c));
}

function applyStatusFilter(recs,fStatus){
  if(fStatus==='ip') return recs.filter(r=>r.isIP).map(r=>({...r,ls:0,as_:0,ls_c:0,as_c:0}));
  if(fStatus==='sub') return recs.map(r=>({...r,lp:0,ap:0,lp_c:0,ap_c:0}));
  return recs;
}

function fmt(v){return'$'+Math.round(v||0).toLocaleString();}
function fmtAvg(t,c){return c>0?'$'+(t/c).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','):'—';}
function initials(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function clearFilters(){['fFrom','fTo'].forEach(id=>document.getElementById(id).value='');['fStatus','fProduct'].forEach(id=>document.getElementById(id).value='');document.getElementById('searchInput').value='';applyFilters();}

function buildStatCols(s){
  function col(lbl,total,count,isIP){const vc=total>0?(isIP?'v-blue':'v-orange'):'v-dim';return`<div class="tot-col"><div class="tot-lbl">${lbl}</div><div class="tot-val ${vc}">${fmt(total)}</div><div class="tot-sub">Avg: <span>${fmtAvg(total,count)}</span> &middot; <span>${count}</span> case${count!==1?'s':''}</div></div>`;}
  return col('Life Submit',s.tLS,s.cLS,false)+col('Life Issued',s.tLP,s.cLP,true)+col('Ann. Submit',s.tAS,s.cAS,false)+col('Ann. Issued',s.tAP,s.cAP,true)+`<div class="summary-tiles"><div class="total-sub"><div class="total-sub-lbl">Total Submit</div><div class="total-sub-val">${fmt(s.tLS+(s.tAS*0.05))}</div></div><div class="total-ip"><div class="total-ip-lbl">Total IP</div><div class="total-ip-val">${fmt(s.tLP+(s.tAP*0.05))}</div></div></div>`;
}
const CK='val_a';
let cfg=JSON.parse(localStorage.getItem(CK)||'{"ep":"https://agencieshq.com/graphql","key":"0843a3f571d3075c445d1b70c774b7b2"}');
let ALL_AGENTS={}, filtered=[];

function showLoading(msg){document.getElementById('agentList').innerHTML=`<div class="loading"><div class="loading-spinner"></div>${msg}</div>`;}

const EXCLUDED_NAMES=['ubaldo','the goal team'];
function isExcluded(name){ return EXCLUDED_NAMES.some(ex=>(name||'').toLowerCase().includes(ex)); }

async function loadData(){
  if(!cfg.key){openCfg();return;}
  document.getElementById('cfgEp').value=cfg.ep||'https://agencieshq.com/graphql';
  document.getElementById('cfgKey').value=cfg.key||'';
  const btn=document.getElementById('loadBtn');btn.classList.add('spinning');btn.disabled=true;
  showLoading('Fetching advisors…');
  try{
    const advisors=(await fetchAdvisors()).filter(a=>!isExcluded(a.name));
    showLoading(`Fetching policies for ${advisors.length} advisors…`);
    const data=await fetchAllAdvisorData(advisors,(done,total)=>showLoading(`Fetching policies… ${done}/${total} advisors`));
    ALL_AGENTS={};
    Object.values(data).forEach(a=>{ALL_AGENTS[a.id]={id:a.id,name:a.name,recs:a.policies.map(p=>classifyPolicy(p,a.id)).filter(Boolean)};});
    const totalPolicies=Object.values(ALL_AGENTS).reduce((s,a)=>s+a.recs.length,0);
    showToast(Object.keys(ALL_AGENTS).length+' agents · '+totalPolicies+' policies');
    applyFilters();
  }catch(e){
    showToast('Error: '+e.message,true);
    document.getElementById('agentList').innerHTML='<div class="no-results">⚠ '+e.message+'</div>';
  }finally{btn.classList.remove('spinning');btn.disabled=false;}
}

function applyFilters(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const fFrom=document.getElementById('fFrom').value,fTo=document.getElementById('fTo').value;
  const fStatus=document.getElementById('fStatus').value,fProduct=document.getElementById('fProduct').value;
  filtered=Object.values(ALL_AGENTS).map(a=>{
    let recs=applyDateProductFilter(a.recs,fFrom,fTo,fProduct);
    recs=applyStatusFilter(recs,fStatus);
    return{...a,frecs:recs};
  }).filter(a=>{
    if(q&&!a.name.toLowerCase().includes(q))return false;
    if(a.frecs.length===0) return false;
    // Exclude if all buckets are zero after status filter
    const s=calcStats(a.frecs);
    return(s.tLS+s.tLP+s.tAS+s.tAP)>0;
  }).sort((a,b)=>{const sa=calcStats(a.frecs),sb=calcStats(b.frecs);if(fStatus==='sub')return(sb.tLS+sb.tAS)-(sa.tLS+sa.tAS);return(sb.tLP+(sb.tAP*0.05))-(sa.tLP+(sa.tAP*0.05));});
  const totalRecs=filtered.reduce((s,a)=>s+a.frecs.length,0);
  document.getElementById('hStat1').textContent=filtered.length;
  document.getElementById('hStat2').textContent=totalRecs.toLocaleString();
  const hasF=q||fFrom||fTo||fStatus||fProduct;
  const allRecs=Object.values(ALL_AGENTS).reduce((s,a)=>s+a.recs.length,0);
  document.getElementById('filterCount').innerHTML=hasF
    ?'<strong>'+filtered.length+'</strong> of '+Object.keys(ALL_AGENTS).length+' agents &middot; <strong>'+totalRecs.toLocaleString()+'</strong> records'
    :'<strong>'+Object.keys(ALL_AGENTS).length+'</strong> agents &middot; <strong>'+allRecs.toLocaleString()+'</strong> records';
  render(q);
}

function render(q){
  const list=document.getElementById('agentList');
  if(!filtered.length){list.innerHTML='<div class="no-results">No agents match the current filters.</div>';return;}
  list.innerHTML=filtered.map((a,i)=>{
    const s=calcStats(a.frecs),rank=i+1,rankCls=rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    const hi=q?a.name.replace(new RegExp(q,'gi'),m=>'<mark>'+m+'</mark>'):a.name;
    const hl=(q&&a.name.toLowerCase().includes(q))?' highlighted':'';
    return`<div class="manager-block${hl}"><div class="manager-row">
      <div class="mgr-left">
        <div class="rank ${rankCls}">${rank}</div>
        <div class="mgr-avatar">${initials(a.name)}</div>
        <div><div class="mgr-name">${hi}</div><div class="mgr-meta">${a.frecs.length} record${a.frecs.length!==1?'s':''}</div></div>
      </div>
      <div class="totals-row">${buildStatCols(s)}</div>
    </div></div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('cfgEp').value=cfg.ep||'https://agencieshq.com/graphql';
  document.getElementById('cfgKey').value=cfg.key||'';
  // Always default to current month
  const now=new Date();
  const firstDay=new Date(now.getFullYear(),now.getMonth(),1);
  const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0);
  const toISO=d=>d.toISOString().slice(0,10);
  document.getElementById('fFrom').value=toISO(firstDay);
  document.getElementById('fTo').value=toISO(lastDay);
  if(cfg.key) showToast('Key loaded — click Load Data');
});
</script>
