<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1080" />
<title>Valoram — Business Worth VSL</title>
<script src="gsap.min.js"></script>
<link rel="stylesheet" href="vo/fonts.css" />
<style>
  :root{
    --bg:#0a0a0a; --accent:#F8964C; --accent2:#f97316; --accent-d:#e8621a;
    --ink:#fff; --mut:rgba(255,255,255,.74); --dim:rgba(255,255,255,.46);
    --og:rgba(248,150,76,.10); --ob:rgba(248,150,76,.26); --line:rgba(255,255,255,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',system-ui,sans-serif;background:#000}
  #root{position:relative;width:1080px;height:1080px;overflow:hidden;color:var(--ink);
    background:
      radial-gradient(60% 52% at 85% 6%, rgba(248,150,76,.16), transparent 60%),
      radial-gradient(54% 48% at 6% 96%, rgba(248,150,76,.09), transparent 60%),
      var(--bg)}
  #root::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(248,150,76,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(248,150,76,.035) 1px,transparent 1px);
    background-size:90px 90px}
  .vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 240px rgba(0,0,0,.6)}

  .clip{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:130px 110px 150px}

  .eyebrow{font-family:'Poppins';font-size:25px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:12px}
  .eyebrow.box{border:1px solid var(--ob);background:var(--og);padding:10px 22px}
  .divider{width:84px;height:4px;background:var(--accent);margin:30px 0}

  .kicker{font-family:'Poppins';font-size:26px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}

  h1{font-family:'Marcellus',serif;font-size:80px;line-height:1.1;font-weight:400;
    letter-spacing:-.01em;max-width:880px}
  .o{color:var(--accent);font-style:italic}
  .sub{font-family:'Poppins';font-size:31px;color:var(--mut);margin-top:30px;max-width:800px;line-height:1.5}

  .figure{font-family:'Marcellus',serif;font-size:188px;line-height:.95;color:var(--accent);
    letter-spacing:-.02em;white-space:nowrap}
  .fig-suffix{font-family:'Poppins';font-size:34px;font-weight:500;color:var(--ink);margin-top:20px;max-width:780px;line-height:1.4}

  .tag-row{display:flex;gap:18px;margin-top:40px;flex-wrap:wrap;justify-content:center}
  .tag{font-family:'Poppins';font-size:30px;font-weight:600;color:var(--ink);
    border:1px solid var(--ob);background:var(--og);padding:16px 32px}
  .tag .dot{color:var(--accent);margin-right:12px}

  .cta-btn{margin-top:44px;font-family:'Poppins';font-weight:700;font-size:32px;letter-spacing:.04em;
    text-transform:uppercase;color:#0a0a0a;background:var(--accent);padding:30px 60px;border-radius:6px;
    box-shadow:0 16px 60px rgba(248,150,76,.34);max-width:900px}
  .scarcity{margin-top:38px;font-family:'Poppins';font-size:23px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:16px}
  .scarcity::before,.scarcity::after{content:'';width:40px;height:1px;background:rgba(248,150,76,.45)}
  .logo-chip{margin-top:44px;background:#fff;border-radius:14px;padding:16px 26px;display:inline-flex}
  .logo-chip img{height:48px;display:block}

  .compliance{position:absolute;left:0;right:0;bottom:46px;text-align:center;z-index:6;
    font-family:'Poppins';font-size:20px;color:var(--dim);letter-spacing:.02em}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1080" data-duration="__DURATION__">
  <audio id="vo" src="__AUDIO_SRC__" data-start="0" data-duration="__DURATION__" data-volume="1"></audio>

__SCENES__

  <div class="compliance">Illustrative only — not a formal appraisal or financial advice.</div>
  <div class="vig"></div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const E = "power3.out";
  const S = __S_ARRAY__;
  const L = __L_ARRAY__;
  S.forEach((st,i)=>{
    const n=i+1;
    tl.fromTo("#sc"+n,{opacity:0},{opacity:1,duration:.4,ease:"none"},st);
    if(i < S.length-1) tl.to("#sc"+n,{opacity:0,duration:.4,ease:"none"},st+L[i]-0.4);
    tl.from("#sc"+n+" .anim",{y:34,opacity:0,duration:.6,ease:E,stagger:.14}, st+0.05);
    tl.from("#sc"+n+" .pop",{scale:.84,duration:.55,ease:"back.out(1.6)",stagger:.12}, st+0.42);
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
